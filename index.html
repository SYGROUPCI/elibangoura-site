<body>
<div class="hall" id="hall">
  <header class="marque">
    <h1 class="nom">Elisabeth Bangoura</h1>
    <p class="sous">Maison fondée à Logroño · MMXXVI</p>
  </header>

  <!-- Les fils de laine (décoratifs), dessinés par maison.js derrière le polaroid -->
  <svg class="fils" id="fils" aria-hidden="true" focusable="false"></svg>

  <div class="coeur" id="coeur">
    <figure class="pola">
      <span class="pince" aria-hidden="true"></span>
      <div class="pic"><img data-polaroid src="photos/eli-polaroid.webp" width="540" height="864" alt="Elisabeth Bangoura en robe bordeaux" fetchpriority="high"></div>
      <figcaption>Eli, 2026</figcaption>
    </figure>
  </div>

  <!--
    LES MONDES
    Un monde ouvert : <a class="monde ouvert" href="…">. Un monde à venir : <button type="button" class="monde futur">.
    data-k : le petit intitulé · data-fond / data-encre : les couleurs de son atmosphère · data-p : la phrase du passage.
    Pour ouvrir un monde à venir : remplace <button type="button" class="monde futur"> par <a class="monde ouvert" href="/…/"> (et </button> par </a>).
    Les fils se recalculent tout seuls.
  -->
  <nav class="mondes" id="mondes" aria-label="Les mondes de la Maison">
    <a class="monde ouvert" href="https://sygroupci.github.io/mi-espanol/" data-fond="#4b1f72" data-encre="#ffe08a" data-p="Un peu d'espagnol chaque jour, même cinq minutes.">
      <span class="noeud" aria-hidden="true"></span><span class="k">La langue</span><span class="t">Mi Español</span>
    </a>
    <a class="monde ouvert" href="sur-le-metier/" data-fond="#1f1029" data-encre="#ead3a0" data-p="Les chantiers en cours, tissés rang après rang.">
      <span class="noeud" aria-hidden="true"></span><span class="k">L'atelier</span><span class="t" style="view-transition-name:metier-titre">Sur le métier</span>
    </a>
    <button type="button" class="monde futur" data-fond="#5e1428" data-encre="#f6dfe2" data-p="Ce qui m'a plu en chemin, gardé pour plus tard.">
      <span class="noeud" aria-hidden="true"></span><span class="k">Le cabinet</span><span class="t">Coups de cœur</span>
    </button>
    <button type="button" class="monde futur" data-fond="#2f3f33" data-encre="#e8efe2" data-p="Ce qui sort de mes dix doigts.">
      <span class="noeud" aria-hidden="true"></span><span class="k">Les pièces</span><span class="t">Fait main</span>
    </button>
    <button type="button" class="monde futur" data-fond="#efe6d8" data-encre="#2a1d36" data-p="Les collections de la Maison, le jour venu.">
      <span class="noeud" aria-hidden="true"></span><span class="k">La boutique</span><span class="t">Maison</span>
    </button>
    <button type="button" class="monde futur" data-monde="carnets" data-fond="#e9dfcf" data-encre="#3b1859" data-p="Récits, images et coulisses, de Conakry à Logroño.">
      <span class="noeud" aria-hidden="true"></span><span class="k">Le journal</span><span class="t">Carnets</span>
    </button>
    <button type="button" class="monde futur" data-fond="#0d0d12" data-encre="#c9a86a" data-p="Collaborations, presse et invitations.">
      <span class="noeud" aria-hidden="true"></span><span class="k">Rendez-vous</span><span class="t">Écrire</span>
    </button>
  </nav>

  <p class="pied">Touchez un monde pour y entrer</p>
</div>

<div class="portail" id="portail" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="portail-titre">
  <span class="k" id="portail-k"></span>
  <h2 id="portail-titre"></h2>
  <p id="portail-p"></p>
  <span class="etat" id="portail-etat"></span>
  <button type="button" id="portail-retour">Revenir au hall</button>
</div>
