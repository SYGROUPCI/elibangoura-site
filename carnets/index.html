<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnets · Elisabeth Bangoura</title>
<meta name="description" content="Les carnets d'Elisabeth Bangoura (Eli Bangoura) : récits, images et coulisses, depuis Logroño.">
<meta name="theme-color" content="#e9dfcf">
<link rel="canonical" href="https://elibangoura.com/carnets/">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://elibangoura.com/carnets/">
<meta property="og:title" content="Carnets · Elisabeth Bangoura">
<meta property="og:description" content="Récits, images et coulisses, depuis Logroño.">
<meta property="og:image" content="https://elibangoura.com/og.jpg">
<style>
@font-face{font-family:"Instrument Serif";src:url(../fonts/instrument-serif.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Serif";src:url(../fonts/instrument-serif-italic.woff2) format("woff2");font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:"DM Mono";src:url(../fonts/dm-mono-400.woff2) format("woff2");font-weight:400;font-style:normal;font-display:swap}
@view-transition{navigation:auto}
:root{--papier:#e9dfcf;--encre:#3b1859;--texte:#3a2f45;--doux:#7a6a88;--or:#9c7a2e;
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32  0 0 0 0 .22  0 0 0 0 .12  0 0 0 .12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{min-height:100vh;background:var(--papier) var(--noise);color:var(--texte);font-family:"DM Mono",ui-monospace,monospace}
.monde{max-width:620px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 22px calc(60px + env(safe-area-inset-bottom))}
.retour{display:inline-flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--doux);text-decoration:none;padding:10px 0}
.retour::before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--or),#7b48a8)}
.kick{margin-top:38px;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--or)}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-style:italic;font-size:clamp(64px,19vw,110px);line-height:.86;letter-spacing:-.02em;margin-top:10px;color:var(--encre)}
.intro{margin-top:18px;font-size:13px;line-height:1.7;color:var(--doux);max-width:360px}
#carnets-liste{margin-top:56px;display:flex;flex-direction:column;gap:64px}
.carnet{position:relative;padding-top:26px;border-top:1px solid rgba(59,24,89,.18)}
.carnet .date{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--or)}
.carnet h2{margin-top:10px;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:clamp(32px,8vw,44px);line-height:1.02;color:var(--encre)}
.carnet .photo{margin:22px -6px 0;background:#fbf8f2;padding:10px 10px 34px;transform:rotate(-1deg);box-shadow:0 2px 3px rgba(40,20,50,.12),0 22px 34px -16px rgba(40,20,50,.45)}
.carnet .photo img{display:block;width:100%;height:auto}
.carnet .texte{margin-top:22px;font-family:"Instrument Serif",Georgia,serif;font-size:20px;line-height:1.5;color:var(--texte)}
.carnet .texte p+p{margin-top:14px}
.vide{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:24px;color:var(--doux)}
footer{margin-top:70px;font-size:10.5px;letter-spacing:.06em;color:var(--doux)}
@media (prefers-reduced-motion:reduce){@view-transition{navigation:none}}
</style>
</head>
<body>
<main class="monde">
  <a class="retour" href="../">Revenir au hall</a>
  <p class="kick">Le journal</p>
  <h1>Carnets</h1>
  <p class="intro">Récits, images et coulisses, au fil des jours.</p>
  <!-- Les carnets sont insérés ici par le programme du site, à partir de l'atelier. -->
  <div id="carnets-liste"><p class="vide">Le premier carnet s'écrit en ce moment.</p></div>
  <footer>© 2026 Elisabeth Bangoura · les carnets</footer>
</main>
</body>
</html>
